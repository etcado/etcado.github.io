<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERDEM TURGUT</title>
<meta name="description" content="Portfolio von Erdem Turgut – Video, KI und Fotografie.">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>

<div class="hud" id="hud" aria-live="polite">
    <p class="hud-text" id="hud-text"></p>
    <h2 class="hud-title"><span id="hud-title"></span> <span class="hud-year" id="hud-year"></span></h2>
    <ul class="hud-tags" id="hud-tags"></ul>
</div>

<nav class="toolbar">
    <button type="button" class="icon" id="btn-info" aria-label="Über mich" title="Über mich">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r="0.6" class="dot"/></svg>
    </button>
    <button type="button" class="icon" id="btn-lens" aria-label="Lupengrösse" title="Lupengrösse">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    </button>
    <button type="button" class="icon" id="btn-theme" aria-label="Hell/Dunkel" title="Hell/Dunkel">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
    </button>
    <a class="icon" href="mailto:hallo@example.com" aria-label="Kontakt" title="Kontakt">
        <svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
    </a>
</nav>

<div class="about" id="about" hidden>
    <div class="about-card" role="dialog" aria-modal="true" aria-labelledby="about-title">
        <button type="button" class="about-close" id="about-close" aria-label="Schliessen">×</button>
        <h1 id="about-title">Erdem Turgut</h1>
        <p class="about-sub">Video · KI · Fotografie</p>
        <p>
            Hier steht ein kurzer Text über dich und deine Arbeit. Bewege die Maus über die Bilder –
            wo du verweilst, erscheinen Titel und Beschreibung des Projekts.
        </p>
        <p class="about-hint">Ziehen oder scrollen, um dich durch das Raster zu bewegen.</p>
        <p><a href="mailto:hallo@example.com">hallo@example.com</a></p>
    </div>
</div>

<noscript>
    <p class="noscript">Bitte JavaScript aktivieren, um das Portfolio zu sehen.</p>
</noscript>

<script src="projects.js"></script>
<script src="main.js"></script>
</body>
</html>
